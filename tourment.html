<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="tourment_style.css" >
  <title>Турнір по speedrun S.T.A.L.K.E.R.2</title>
  <link rel="icon" href="https://github.com/pereboichukartem/S.T.A.L.K.E.R.2/blob/main/radiation-sign.png?raw=true" >
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="radiation-sign.png" height="60px">
            <h2>Турнір по speedrun S.T.A.L.K.E.R.2</h2>
        </div>
        <div class="menu">
            <a href="https://pereboichukartem.github.io/S.T.A.L.K.E.R.2/S.T.A.L.K.E.R._menu" class="but">Головна</a>
            <a href="https://pereboichukartem.github.io/S.T.A.L.K.E.R.2/tourment" class="but">Турнір</a>
            <a href="https://pereboichukartem.github.io/S.T.A.L.K.E.R.2/news" class="but">Новини</a>
        </div>
    </header>
    <main>
      <div class="hero-img">
        <img src="Skif.webp" width="300px" height="500px" >
      </div>
      <div class="form-container">
      <form action="#" method="POST" class="register-form">
        
        <div class="form-group">
          <label for="name"><i class="fa-regular fa-user"></i> Ім'я гравця(справжнє)</label>
          <input type="text" id="name" name="name" placeholder="Введіть ваше ім'я" required>
        </div>
    
        <div class="form-group">
          <label for="username"><i class="fa-solid fa-user"></i> Нік гравця</label>
          <input type="email" id="username" name="username" placeholder="Введіть ваш нік" required>
        </div>
    
        <div class="form-group">
          <label for="link"><i class="fa-solid fa-video"></i> Прикріпи посилання на відео</label>
          <input type="link" id="link" name="link" placeholder="Посилання на відео" required>
        </div>
    
        <buttom type="submit" class="btn-submit" >ЗАРЕЄСТРУВАТИСЯ!</buttom>
      </form>
    </div>
    </main>
    <footer>
      <div class="footer_info">
        <h3>© 2026 S.T.A.L.K.E.R. 2 Speedrun Tournament</h3>
        <h3>Організатор: STALKER Community</h3>
      </div>
      <div class="footer_brands">
        <h3><i class="fa-brands fa-discord"></i> Discord: <a class="a_footer" href="https://discord.gg/stalker2" >discord.gg/stalker2</a></h3>
        <h3><i class="fa-brands fa-telegram"></i> Telegram: @stalker2_tournament</h3>
      </div>
    </footer>
</body>

</html>
